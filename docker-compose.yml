services:
  aral-price-monitor:
    image: ${IMAGE_REPOSITORY:-ghcr.io/YOUR_GITHUB_USER/aral-price-monitor}:${IMAGE_TAG:-latest}
    container_name: aral-price-monitor
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8095}:8000"
    volumes:
      - ${DATA_PATH:-./data}:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
