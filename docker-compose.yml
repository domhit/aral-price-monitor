services:
  aral-price-monitor:
    image: ghcr.io/DEIN_GITHUB_BENUTZER/aral-price-monitor:latest
    container_name: aral-price-monitor
    restart: unless-stopped
    ports:
      - "8095:8000"
    volumes:
      - /volume1/docker/aral-price-monitor/data:/data
    environment:
      TZ: Europe/Berlin
      DATABASE_PATH: /data/aral-price-monitor.db
      POLL_INTERVAL_SECONDS: 300
      MQTT_ENABLED: "true"
      MQTT_HOST: 192.168.0.10
      MQTT_PORT: 1883
      MQTT_USER: ""
      MQTT_PASSWORD: ""
      MQTT_DISCOVERY_PREFIX: homeassistant
      MQTT_BASE_TOPIC: aral_price_monitor
      SPRITMONITOR_ENABLED: "false"
      SPRITMONITOR_APP_TOKEN: ""
      SPRITMONITOR_BEARER_TOKEN: ""
      SPRITMONITOR_SYNC_MODE: "read_only"
      ANALYSIS_DAYS: 30
      TANK_ASSISTANT_ENABLED: "true"
      TANK_ASSISTANT_MAX_PRICE_AGE_MIN: "60"
      TANK_ASSISTANT_DEFAULT_MIN_ADVANTAGE: "2.0"
      TANK_ASSISTANT_DEFAULT_MAX_DISTANCE: "15"
      TANKERKOENIG_ENABLED: "false"
      TANKERKOENIG_API_KEY: ""
      TANKERKOENIG_LAT: ""
      TANKERKOENIG_LNG: ""
      TANKERKOENIG_RADIUS: "10"
      OSRM_BASE_URL: "https://router.project-osrm.org"
      OSRM_CACHE_HOURS: "24"
      OSRM_ROUTE_CANDIDATES: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
