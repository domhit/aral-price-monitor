services:
  aral-price-monitor:
    image: ghcr.io/DEIN_GITHUB_BENUTZER/aral-price-monitor:latest
    container_name: aral-price-monitor
    restart: unless-stopped
    ports:
      - "8095:8000"
    volumes:
      - /volume1/docker/aral-price-monitor/data:/data
    environment:
      TZ: Europe/Berlin
      DATABASE_PATH: /data/aral-price-monitor.db
      POLL_INTERVAL_SECONDS: 300
      MQTT_ENABLED: "true"
      MQTT_HOST: 192.168.0.10
      MQTT_PORT: 1883
      MQTT_USER: ""
      MQTT_PASSWORD: ""
      MQTT_DISCOVERY_PREFIX: homeassistant
      MQTT_BASE_TOPIC: aral_price_monitor
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
